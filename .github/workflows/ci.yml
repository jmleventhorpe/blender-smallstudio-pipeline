name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_SERIES: "5.2"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright

  unit:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  blender:
    name: Blender tests and extension
    runs-on: ubuntu-latest
    needs: [lint, unit]
    permissions:
      contents: write # Attach the zip to releases.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          name="blender-${BLENDER_VERSION}-linux-x64"
          curl -fsSL --retry 3 -o blender.tar.xz \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/${name}.tar.xz"
          mkdir -p ~/blender
          tar -xJf blender.tar.xz -C ~/blender --strip-components=1

      - name: Install Blender's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libgl1 libegl1

      - name: Install pytest for Blender's Python
        run: uv pip install --python 3.13 --target .blender-site pytest

      - name: Blender tests
        run: ~/blender/blender -b --factory-startup --python tests/blender/run.py

      - name: Build and validate the extension
        run: BLENDER=~/blender/blender uv run python scripts/build_extension.py

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
