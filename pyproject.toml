[project]
name = "blender-smallstudio-pipeline"
version = "0.1.0"
description = "Publishing, loading and scene construction for small animation teams, entirely inside Blender."
readme = "README.md"
# Blender 5.2 bundles Python 3.13; the core is tested on the same version.
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "James Leventhorpe" }]
dependencies = []

[dependency-groups]
dev = [
    "fake-bpy-module-5.2>=20260730",
    "publish-validator",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.uv]
# The code ships as a Blender extension, not a wheel; tests import it from src/.
package = false

[tool.uv.sources]
# The same wheel the extension bundles (see blender_manifest.toml).
publish-validator = { path = "src/smallstudio_pipeline/wheels/publish_validator-0.2.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests/core"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TID251"]

# The core runs without Blender: Blender modules are banned everywhere, then allowed in
# the Blender layer, the checks, the Blender tests and the spikes (per-file-ignores).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"bpy".msg = "Only the Blender layer imports Blender; put this in smallstudio_pipeline.blender."
"bmesh".msg = "Only the Blender layer imports Blender; put this in smallstudio_pipeline.blender."
"mathutils".msg = "Only the Blender layer imports Blender; put this in smallstudio_pipeline.blender."

[tool.ruff.lint.per-file-ignores]
# Blender's own code: Blender imports allowed (TID251). Spikes and the Blender test
# runner set sys.path before importing (E402). Blender declares operator settings as
# class attributes, bl_options = {"REGISTER"}, and publish-validator checks do the same,
# hosts = ["blender"] (RUF012).
"spikes/*" = ["E402", "TID251"]
"tests/blender/*" = ["TID251"]
"tests/blender/run.py" = ["E402", "TID251"]
"src/smallstudio_pipeline/blender/**" = ["RUF012", "TID251"]
"src/smallstudio_pipeline/checks/**" = ["RUF012", "TID251"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
extraPaths = ["src"]
# fake-bpy-module ships stubs only; there is no bpy source outside Blender.
reportMissingModuleSource = false
# Blender declares properties as annotations that are calls: name: StringProperty().
reportInvalidTypeForm = false

# Where the Blender stubs are stricter than Blender itself.
[[tool.pyright.executionEnvironments]]
root = "src/smallstudio_pipeline/blender"
reportOptionalMemberAccess = false # self.layout is never None inside draw().

[[tool.pyright.executionEnvironments]]
root = "tests/blender"
reportAttributeAccessIssue = false # bpy.ops.pipeline exists once the add-on registers.
# The stubs mark values as optional that never are in practice (selected_objects,
# object.data); tests would only fill up with asserts.
reportOptionalMemberAccess = false
reportOptionalIterable = false
