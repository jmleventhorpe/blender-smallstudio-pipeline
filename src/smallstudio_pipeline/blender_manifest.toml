schema_version = "1.0.0"

id = "smallstudio_pipeline"
version = "0.1.0"
name = "Small Studio Pipeline"
tagline = "Publishing, loading and shot building for small teams"
maintainer = "James Leventhorpe"
type = "add-on"
website = "https://github.com/jmleventhorpe/blender-smallstudio-pipeline"
tags = ["Pipeline"]

blender_version_min = "5.2.0"
license = ["SPDX:GPL-3.0-or-later"]

# publish-validator, built from its v0.2.0 tag and committed here; Blender installs it.
wheels = ["./wheels/publish_validator-0.2.0-py3-none-any.whl"]

[permissions]
files = "Read and write project workfiles, publishes and metadata"

[build]
paths_exclude_pattern = ["__pycache__/", ".ruff_cache/", "ruff.toml"]
